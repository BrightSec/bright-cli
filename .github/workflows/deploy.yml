name: Automated deploy

on:
  release:
    types: [ created ]

env:
  VERSION: ${{ github.event.release.tag_name }}
  TARGET_REF: ${{ github.event.release.target_commitish }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Set TAG based on target_commitish
        id: set-tag
        run: |
          if [ "${{ github.event.release.target_commitish }}" == "next" ]; then
            echo "tag=next" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.target_commitish }}" == "alpha" ]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.target_commitish }}" == "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            exit 1
          fi

  install-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Install deps
        uses: ./.github/workflows/composite/npm

  build:
    runs-on: ubuntu-latest
    needs: install-deps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Set default distribution
        run: npm pkg set brightCli.distribution=package

      - name: Build package
        run: npm run build
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Pack artifacts
        run: npm pack

      - uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./brightsec-cli-*
          tag: ${{ github.ref }}
          file_glob: true

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist
            Dockerfile
            package.json
            package-lock.json
            README.md
            LICENSE
            tools

  generate-binary:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
          - os: macos-14
            target: macos
          - os: ubuntu-22.04
            target: linux
            container:
              image: redhat/ubi8
              options: "--user root"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Install dev-deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          dnf install -y dnf-utils \
          && dnf install -y python3 gcc gcc-c++ make \
          && rm -rf /var/cache/dnf

      - name: Install deps
        uses: ./.github/workflows/composite/npm

      - name: Set distribution
        run: npx json -I -f package.json -e "this.brightCli.distribution='${{ matrix.target }}-executable'"

      - name: Build executable file
        run: npm run build:pkg -- -t node24-${{ matrix.target }}-x64

      # pkg output is a renamed node.exe; rewrite its VERSIONINFO/icon so the
      # publisher metadata matches the code signing certificate (SmartScreen).
      - name: Set Windows version info
        if: startsWith(matrix.os, 'win')
        run: node .\tools\scripts\set-windows-version-info.mjs .\bin\cli.exe

      # DigiCert KeyLocker code signing (Windows only).
      # If the SM_* secrets are not configured (e.g. local re-runs), signing is
      # skipped gracefully and unsigned artifacts are produced.
      - name: Prepare Windows code signing
        id: signing
        if: startsWith(matrix.os, 'win')
        shell: bash
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          if [ -z "$SM_API_KEY" ]; then
            echo "DigiCert KeyLocker secrets are not configured; Windows artifacts will not be signed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$SM_CLIENT_CERT_FILE_B64" | base64 --decode > "${RUNNER_TEMP}/client-auth-cert.p12"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install DigiCert KeyLocker client tools
        if: startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        uses: digicert/code-signing-software-trust-action@v1
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}/client-auth-cert.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Sync code signing certificate to the Windows store
        if: startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}/client-auth-cert.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        run: smctl windows certsync
        shell: pwsh

      - name: Sign Windows executable
        if: startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}/client-auth-cert.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: .\tools\scripts\sign-windows.ps1 -FilePath .\bin\cli.exe
        shell: pwsh

      # roots.exe (from the win-ca package) is bundled into the MSI, so it is
      # staged and signed here before build-msi.ps1 packages it.
      - name: Sign bundled roots.exe
        if: startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}/client-auth-cert.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          Copy-Item .\node_modules\win-ca\lib\roots.exe -Destination .\bin\roots.exe
          .\tools\scripts\sign-windows.ps1 -FilePath .\bin\roots.exe
        shell: pwsh

      - name: Build MSI
        if: startsWith(matrix.os, 'win')
        run: .\tools\scripts\build-msi.ps1
        shell: pwsh

      - name: Sign Windows installer (MSI)
        if: startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}/client-auth-cert.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: .\tools\scripts\sign-windows.ps1 -FilePath .\bin\bright-cli.msi
        shell: pwsh

      - name: Remove decoded client-auth certificate
        if: always() && startsWith(matrix.os, 'win') && steps.signing.outputs.enabled == 'true'
        run: Remove-Item -Path "${{ runner.temp }}/client-auth-cert.p12" -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ startsWith(matrix.os, 'win') && '.\bin\cli.exe' || './bin/cli' }}
          asset_name: ${{ format('bright-cli-{0}-x64{1}', matrix.target, startsWith(matrix.os, 'win') && '.exe' || '') }}
          tag: ${{ github.ref }}

      - uses: svenstaro/upload-release-action@2.9.0
        if: startsWith(matrix.os, 'win')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: .\bin\bright-cli.msi
          asset_name: bright-cli.msi
          tag: ${{ github.ref }}

      - name: Calculate checksum
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            certutil -hashfile ./bin/cli.exe SHA256 | grep -v "CertUtil" | sed 's/SHA256 hash of .*://' | tr -d " \t\n\r" > checksum.txt
            certutil -hashfile ./bin/bright-cli.msi SHA256 | grep -v "CertUtil" | sed 's/SHA256 hash of .*://' | tr -d " \t\n\r" > checksum.msi.txt
          elif [[ "${{ matrix.os }}" == "macos-14" ]]; then
            shasum -a 256 ./bin/cli | cut -d' ' -f1 > checksum.txt
          else
            sha256sum ./bin/cli | cut -d' ' -f1 > checksum.txt
          fi

      - uses: svenstaro/upload-release-action@2.9.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: checksum.txt
          asset_name: ${{ format('bright-cli-{0}-x64{1}.sha256', matrix.target, startsWith(matrix.os, 'win') && '.exe' || '') }}
          tag: ${{ github.ref }}

      - uses: svenstaro/upload-release-action@2.9.0
        if: startsWith(matrix.os, 'win')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: checksum.msi.txt
          asset_name: bright-cli.msi.sha256
          tag: ${{ github.ref }}

  publish-npm:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [build, resolve-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Setup node
        uses: ./.github/workflows/composite/npm

      - name: Set NPM distribution
        run: npm pkg set brightCli.distribution=npm

      - run: npx -y npm@^11.5.1 publish --tag ${{ needs.resolve-tag.outputs.tag }}
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-gpr:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [build, resolve-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Prepare GPR package
        run: npm pkg set brightCli.distribution=gpr

      - name: Setup node
        uses: ./.github/workflows/composite/npm
        with:
          registry: 'https://npm.pkg.github.com'
          scope: '@NeuraLegion'

      - run: npm publish --tag ${{ needs.resolve-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_TOKEN }}

  publish-docker:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: [publish-npm, resolve-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Wait for NPM propagation
        run: |
          for i in {1..20}; do
            if npm view @brightsec/cli@${{ env.VERSION }} version; then
              echo "Package available!"
              exit 0
            fi
            echo "Waiting for package to propagate (attempt $i/20)..."
            sleep 15
          done
          echo "Timeout waiting for NPM package"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_BRIGHT_USER }}
          password: ${{ secrets.DOCKERHUB_BRIGHT_TOKEN }}

      - name: Build and Push Multi-Platform Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            brightsec/cli:${{ env.VERSION }}
            brightsec/cli:${{ needs.resolve-tag.outputs.tag }}

  publish-helm:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    needs: publish-docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.GPR_TOKEN }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GPR_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package Chart
        run: helm package helm/bright-cli --version ${VERSION#v} --app-version $VERSION --destination .

      - name: Build Helm repository name
        run: echo "HELM_REPOSITORY_OWNER=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Push charts to GHCR
        run: helm push ./bright-cli-*.tgz oci://ghcr.io/${{ env.HELM_REPOSITORY_OWNER }}

  e2e-tests:
    needs: [resolve-tag, publish-npm, publish-gpr, publish-docker, publish-helm, generate-binary]
    if: ${{ needs.resolve-tag.outputs.tag == 'next' }}
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ github.event.release.tag_name }}
      environment: development
    secrets: inherit

  smoke-tests:
    needs: [resolve-tag, publish-npm, publish-gpr, publish-docker, publish-helm, generate-binary]
    if: ${{ needs.resolve-tag.outputs.tag == 'latest' }}
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ github.event.release.tag_name }}
      environment: staging
    secrets: inherit
